name: visionOS SideStore Build

# Builds the unsigned iPad-compatible IPA that runs on Apple Vision Pro
# (same recipe as the visionos-0.7.0 release: iOS SDK archive, arm64,
# CODE_SIGNING_ALLOWED=NO, PlugIns/AltWidgetExtension.appex stripped because a
# sideload cannot provision it). Needs no repository secrets.

on:
  workflow_dispatch:
    inputs:
      xcode-version:
        description: "Xcode version on the macos-26 runner"
        required: false
        default: "26.6"
  push:
    branches: [visionos-signin-fix]
    paths-ignore:
      - '**.md'

concurrency:
  group: visionos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    env:
      ARCHIVE_PATH: build/SideStore-visionOS.xcarchive
      IPA_NAME: SideStore-visionOS.ipa

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: ${{ github.event.inputs.xcode-version || '26.6' }}

      - name: Tooling
        run: brew install xcbeautify

      - name: Build info
        run: |
          xcodebuild -version
          grep -E 'MARKETING_VERSION|CURRENT_PROJECT_VERSION' Build.xcconfig
          git submodule status

      - name: Archive (unsigned, iOS SDK)
        run: |
          set -o pipefail
          mkdir -p build/logs
          NSUnbufferedIO=YES xcodebuild archive \
            -project AltStore.xcodeproj \
            -scheme SideStore \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=XYZ0123456 \
            ORG_IDENTIFIER=com.SideStore \
            2>&1 | tee build/logs/archive.log | xcbeautify --renderer github-actions

      - name: Package IPA (strip PlugIns)
        run: |
          set -euo pipefail
          APP="$ARCHIVE_PATH/Products/Applications/SideStore.app"
          test -d "$APP"
          rm -rf "$APP/PlugIns"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/SideStore.app
          rm -f "$IPA_NAME"
          (cd build && zip -qr -9 "../$IPA_NAME" Payload)
          echo "--- bundle"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' -c 'Print :CFBundleShortVersionString' -c 'Print :CFBundleVersion' -c 'Print :UIRequiredDeviceCapabilities' "$APP/Info.plist"
          lipo -info "$APP/SideStore"
          if unzip -l "$IPA_NAME" | grep -q '\.appex'; then echo "appex still present"; exit 1; fi
          ls -la "$IPA_NAME"
          shasum -a 256 "$IPA_NAME" | tee "$IPA_NAME.sha256"
          (cd "$ARCHIVE_PATH" && zip -qr -9 ../SideStore-visionOS.dSYMs.zip dSYMs)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: build/logs

      - uses: actions/upload-artifact@v4
        with:
          name: SideStore-visionOS
          path: |
            SideStore-visionOS.ipa
            SideStore-visionOS.ipa.sha256
            build/SideStore-visionOS.dSYMs.zip
